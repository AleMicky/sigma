name: sigma-dev

services:
  # ── PostgreSQL (opcional: docker compose --profile local-db up) ─
  postgres:
    image: postgres:16.16-alpine3.23
    container_name: sigma-postgres
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sigma_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - sigma_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-sigma_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sigma-network

  # ── Spring Boot API ──────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: sigma-api
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_SSL_MODE: ${DB_SSL_MODE:-disable}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # Keycloak (el valor de ejemplo de KEYCLOAK_BASE_URL vive solo en .env.example).
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-sigma-api}
      KEYCLOAK_JWT_CLOCK_SKEW_SECONDS: ${KEYCLOAK_JWT_CLOCK_SKEW_SECONDS:-60}
      STORAGE_BASE_DIR: ${STORAGE_BASE_DIR:-./uploads}
      STORAGE_MAX_FILE_SIZE: ${STORAGE_MAX_FILE_SIZE:-20MB}
      STORAGE_MAX_REQUEST_SIZE: ${STORAGE_MAX_REQUEST_SIZE:-20MB}
      STORAGE_MAX_FILE_SIZE_BYTES: ${STORAGE_MAX_FILE_SIZE_BYTES:-20971520}
      DOCUMENTS_MAX_FILE_SIZE_BYTES: ${DOCUMENTS_MAX_FILE_SIZE_BYTES:-20971520}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -Eq '\"status\"[[:space:]]*:[[:space:]]*\"UP\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    volumes:
      - sigma_uploads:/app/uploads
    networks:
      - sigma-network

  # ── React Frontend ───────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
        VITE_APP_NAME: ${VITE_APP_NAME:-SIGMA}
    container_name: sigma-web
    ports:
      - "3000:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - sigma-network

volumes:
  sigma_postgres_data:
  sigma_uploads:

networks:
  sigma-network:
    driver: bridge
