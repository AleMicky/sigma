# Config del contenedor Web (nginxinc/nginx-unprivileged escucha en 8080).
# Los assets versionados de Vite se cachean de forma inmutable; el HTML nunca se cachea.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # ── Compresión ──────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml;

    # ── Assets con hash: inmutables ─────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # ── Otros estáticos sin hash (favicon, fuentes, imágenes) ──
    location ~* \.(?:ico|png|jpe?g|gif|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        try_files $uri =404;
    }

    # ── HTML / SPA fallback: siempre revalidar ─────────────────
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
