spring:
  application:
    name: sigma-api
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://157.173.99.216:8081/realms/sigma}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sigma_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true
    oauth:
      client-id: ${KEYCLOAK_SWAGGER_CLIENT_ID:sigma-swagger}
      use-pkce-with-authorization-code-grant: true

app:
  openapi:
    title: Sigma API
    description: API REST para el Sistema SIGMA
    version: v1
    keycloak:
      authorization-url: ${KEYCLOAK_AUTHORIZATION_URL:http://157.173.99.216:8081/realms/sigma/protocol/openid-connect/auth}
      token-url: ${KEYCLOAK_TOKEN_URL:http://157.173.99.216:8081/realms/sigma/protocol/openid-connect/token}
