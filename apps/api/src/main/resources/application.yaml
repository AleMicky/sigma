spring:
  application:
    name: sigma-api
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://157.173.99.216:8081/realms/sigma}
          # Keycloak por defecto pone aud=account. Aceptamos también sigma-api
          # cuando exista el audience mapper en el client sigma-web.
          audiences:
            - account
            - ${KEYCLOAK_AUDIENCE:sigma-api}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sigma_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  keycloak:
    token-url: ${KEYCLOAK_TOKEN_URL:http://157.173.99.216:8081/realms/sigma/protocol/openid-connect/token}
    logout-url: ${KEYCLOAK_LOGOUT_URL:http://157.173.99.216:8081/realms/sigma/protocol/openid-connect/logout}
    client-id: ${KEYCLOAK_CLIENT_ID:sigma-web}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:}
    audience: ${KEYCLOAK_AUDIENCE:sigma-api}
  openapi:
    title: Sigma API
    description: API REST para el Sistema SIGMA
    version: v1
