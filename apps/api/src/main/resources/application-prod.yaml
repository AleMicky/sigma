spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
  datasource:
    # REQ-BIZ-009: intenta TLS por defecto ("prefer"); usar DB_SSL_MODE=require al habilitar SSL en PostgreSQL.
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=${DB_SSL_MODE:prefer}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      max-lifetime: 600000
      keepalive-time: 300000
      validation-timeout: 5000
  flyway:
    enabled: true
    out-of-order: false
    validate-on-migrate: true
    ignore-migration-patterns: ""

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  keycloak:
    token-url: ${KEYCLOAK_TOKEN_URL}
    logout-url: ${KEYCLOAK_LOGOUT_URL}
    client-id: ${KEYCLOAK_CLIENT_ID}
    client-secret: ${KEYCLOAK_CLIENT_SECRET}

flowable:
  base-url: ${FLOWABLE_BASE_URL}
  username: ${FLOWABLE_USERNAME}
  password: ${FLOWABLE_PASSWORD}

