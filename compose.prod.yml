name: sigma-prod

services:
  # ── Spring Boot API ──────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: sigma-api
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      KEYCLOAK_TOKEN_URL: ${KEYCLOAK_TOKEN_URL}
      KEYCLOAK_LOGOUT_URL: ${KEYCLOAK_LOGOUT_URL}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-sigma-api}
      FLOWABLE_BASE_URL: ${FLOWABLE_BASE_URL:-http://157.173.99.216:8089/flowable-rest/service}
      FLOWABLE_USERNAME: ${FLOWABLE_USERNAME:-admin}
      FLOWABLE_PASSWORD: ${FLOWABLE_PASSWORD}

      JAVA_OPTS: "-Xms256m -Xmx512m"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/v3/api-docs || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - sigma_uploads:/app/uploads
    networks:
      - infraestructura-network

  # ── React Frontend ───────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_APP_NAME: ${VITE_APP_NAME:-SIGMA}
    container_name: sigma-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - infraestructura-network

volumes:
  sigma_uploads:

networks:
  infraestructura-network:
    external: true
