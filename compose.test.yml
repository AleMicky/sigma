name: sigma-test

services:
  # ── Spring Boot API ──────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: sigma-api
    restart: unless-stopped

    env_file:
      - path: .env.test
        required: false

    environment:
      # Perfil estricto: el stack de test nunca debe caer en "dev" por omisión.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?Definir SPRING_PROFILES_ACTIVE=test en .env.test}
      SERVER_PORT: ${SERVER_PORT:-8080}

      # Base de datos externa
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL_MODE: ${DB_SSL_MODE:-disable}

      # Almacenamiento de archivos
      STORAGE_BASE_DIR: ${STORAGE_BASE_DIR:-./uploads}
      STORAGE_MAX_FILE_SIZE: ${STORAGE_MAX_FILE_SIZE:-20MB}
      STORAGE_MAX_REQUEST_SIZE: ${STORAGE_MAX_REQUEST_SIZE:-20MB}
      STORAGE_MAX_FILE_SIZE_BYTES: ${STORAGE_MAX_FILE_SIZE_BYTES:-5242880}
      DOCUMENTS_MAX_FILE_SIZE_BYTES: ${DOCUMENTS_MAX_FILE_SIZE_BYTES:-20971520}

      # CORS
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      # Keycloak
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      KEYCLOAK_TOKEN_URL: ${KEYCLOAK_TOKEN_URL}
      KEYCLOAK_LOGOUT_URL: ${KEYCLOAK_LOGOUT_URL}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-sigma-api}

      # Flowable
      FLOWABLE_BASE_URL: ${FLOWABLE_BASE_URL}
      FLOWABLE_USERNAME: ${FLOWABLE_USERNAME}
      FLOWABLE_PASSWORD: ${FLOWABLE_PASSWORD}

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/actuator/health | grep -Eq '\"status\"[[:space:]]*:[[:space:]]*\"UP\"' || exit 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 256M

    volumes:
      - sigma_uploads:/app/uploads

    networks:
      - sigma-network

  # ── React Frontend ───────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://sigma-test.endecorani.bo}
        VITE_APP_NAME: ${VITE_APP_NAME:-SIGMA}

    container_name: sigma-web
    restart: unless-stopped

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 192M
        reservations:
          cpus: "0.1"
          memory: 64M

    networks:
      - sigma-network

volumes:
  sigma_uploads:

networks:
  sigma-network:
    external: true
