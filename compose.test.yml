name: sigma-test

services:
  # ── Spring Boot API ──────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: sigma-api
    restart: unless-stopped
    env_file: .env.test
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: ${SERVER_PORT:-8080}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      KEYCLOAK_TOKEN_URL: ${KEYCLOAK_TOKEN_URL}
      KEYCLOAK_LOGOUT_URL: ${KEYCLOAK_LOGOUT_URL}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-sigma-api}
      FLOWABLE_BASE_URL: ${FLOWABLE_BASE_URL}
      FLOWABLE_USERNAME: ${FLOWABLE_USERNAME}
      FLOWABLE_PASSWORD: ${FLOWABLE_PASSWORD}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/v3/api-docs > /dev/null || exit 1" ]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 120s
    volumes:
      - sigma_uploads:/app/uploads
    networks:
      - sigma-network

  # ── React Frontend ───────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://sigma-test.endecorani.bo}
        VITE_APP_NAME: ${VITE_APP_NAME:-SIGMA}
    container_name: sigma-web
    restart: unless-stopped
    env_file: .env.test
    ports:
      - "${WEB_PORT:-3000}:80"
    networks:
      - sigma-network

volumes:
  sigma_uploads:

networks:
  sigma-network:
    driver: bridge
