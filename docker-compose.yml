name: sigma-app

services:
  postgres:
    image: postgres:16-alpine
    container_name: sigma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sigma_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - sigma_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-sigma_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sigma-network

volumes:
  sigma_postgres_data:

networks:
  sigma-network:
    driver: bridge
